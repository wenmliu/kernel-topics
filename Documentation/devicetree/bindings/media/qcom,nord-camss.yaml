%YAML 1.2
---
$id: http://devicetree.org/schemas/media/qcom,nord-camss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Nord Camera Subsystem (CAMSS)

maintainers:
  - Wenmeng Liu <wenmeng.liu@oss.qualcomm.com>

description:
  The CAMSS IP is a CSI decoder and ISP present on Qualcomm platforms.

properties:
  compatible:
    const: qcom,nord-camss

  reg:
    maxItems: 34

  reg-names:
    items:
      - const: csid0
      - const: csid1
      - const: csid2
      - const: csid_lite0
      - const: csid_lite1
      - const: csid_lite2
      - const: csid_lite3
      - const: csid_lite4
      - const: csid_lite5
      - const: csid_lite6
      - const: csid_lite7
      - const: csid_lite8
      - const: csid_lite9
      - const: csiphy0
      - const: csiphy1
      - const: csiphy2
      - const: csiphy3
      - const: csiphy4
      - const: csitpg0
      - const: csitpg1
      - const: csitpg2
      - const: vfe0
      - const: vfe1
      - const: vfe2
      - const: vfe_lite0
      - const: vfe_lite1
      - const: vfe_lite2
      - const: vfe_lite3
      - const: vfe_lite4
      - const: vfe_lite5
      - const: vfe_lite6
      - const: vfe_lite7
      - const: vfe_lite8
      - const: vfe_lite9

  clocks:
    maxItems: 32

  clock-names:
    items:
      - const: camnoc_nrt_axi
      - const: camnoc_rt_axi
      - const: cpas_ahb
      - const: cpas_fast_ahb
      - const: cpas_vfe0
      - const: cpas_vfe1
      - const: cpas_vfe2
      - const: cpas_vfe_lite
      - const: csid
      - const: csid_csiphy_rx
      - const: csiphy0
      - const: csiphy0_timer
      - const: csiphy1
      - const: csiphy1_timer
      - const: csiphy2
      - const: csiphy2_timer
      - const: csiphy3
      - const: csiphy3_timer
      - const: csiphy4
      - const: csiphy4_timer
      - const: gcc_axi_hf
      - const: qdss_debug_xo
      - const: vfe0
      - const: vfe0_fast_ahb
      - const: vfe1
      - const: vfe1_fast_ahb
      - const: vfe2
      - const: vfe2_fast_ahb
      - const: vfe_lite
      - const: vfe_lite_ahb
      - const: vfe_lite_cphy_rx
      - const: vfe_lite_csid

  interrupts:
    maxItems: 34

  interrupt-names:
    items:
      - const: csid0
      - const: csid1
      - const: csid2
      - const: csid_lite0
      - const: csid_lite1
      - const: csid_lite2
      - const: csid_lite3
      - const: csid_lite4
      - const: csid_lite5
      - const: csid_lite6
      - const: csid_lite7
      - const: csid_lite8
      - const: csid_lite9
      - const: csiphy0
      - const: csiphy1
      - const: csiphy2
      - const: csiphy3
      - const: csiphy4
      - const: csitpg0
      - const: csitpg1
      - const: csitpg2
      - const: vfe0
      - const: vfe1
      - const: vfe2
      - const: vfe_lite0
      - const: vfe_lite1
      - const: vfe_lite2
      - const: vfe_lite3
      - const: vfe_lite4
      - const: vfe_lite5
      - const: vfe_lite6
      - const: vfe_lite7
      - const: vfe_lite8
      - const: vfe_lite9

  interconnects:
    maxItems: 2

  interconnect-names:
    items:
      - const: ahb
      - const: hf_mnoc

  iommus:
    maxItems: 2

  power-domains:
    items:
      - description: IFE0 GDSC - Global Distributed Switch Controller for IFE0.
      - description: IFE1 GDSC - Global Distributed Switch Controller for IFE1.
      - description: IFE2 GDSC - Global Distributed Switch Controller for IFE2.
      - description: Titan GDSC - Global Distributed Switch Controller for the entire camss.

  power-domain-names:
    items:
      - const: ife0
      - const: ife1
      - const: ife2
      - const: top

  vdd-csiphy0-0p8-supply:
    description:
      Phandle to a 0.8V regulator supply to CSIPHY0 core block.

  vdd-csiphy0-1p2-supply:
    description:
      Phandle to a 1.2V regulator supply to CSIPHY0 pll block.

  vdd-csiphy1-0p8-supply:
    description:
      Phandle to a 0.8V regulator supply to CSIPHY1 core block.

  vdd-csiphy1-1p2-supply:
    description:
      Phandle to a 1.2V regulator supply to CSIPHY1 pll block.

  vdd-csiphy2-0p8-supply:
    description:
      Phandle to a 0.8V regulator supply to CSIPHY2 core block.

  vdd-csiphy2-1p2-supply:
    description:
      Phandle to a 1.2V regulator supply to CSIPHY2 pll block.

  vdd-csiphy3-0p8-supply:
    description:
      Phandle to a 0.8V regulator supply to CSIPHY3 core block.

  vdd-csiphy3-1p2-supply:
    description:
      Phandle to a 1.2V regulator supply to CSIPHY3 pll block.

  vdd-csiphy4-0p8-supply:
    description:
      Phandle to a 0.8V regulator supply to CSIPHY4 core block.

  vdd-csiphy4-1p2-supply:
    description:
      Phandle to a 1.2V regulator supply to CSIPHY4 pll block.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    description:
      CSI input ports.

    patternProperties:
      "^port@[0-4]$":
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description:
          Input ports for receiving CSI data on CSIPHY 0-4.

        properties:
          endpoint:
            $ref: video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              data-lanes:
                minItems: 1
                maxItems: 4

              bus-type:
                enum:
                  - 1 # MEDIA_BUS_TYPE_CSI2_CPHY
                  - 4 # MEDIA_BUS_TYPE_CSI2_DPHY

            required:
              - data-lanes

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - interrupts
  - interrupt-names
  - interconnects
  - interconnect-names
  - iommus
  - power-domains
  - power-domain-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,nord-camcc.h>
    #include <dt-bindings/clock/qcom,nord-nwgcc.h>
    #include <dt-bindings/interconnect/qcom,icc.h>
    #include <dt-bindings/interconnect/qcom,nord-rpmh.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/power/qcom,rpmhpd.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        isp@ab00000 {
            compatible = "qcom,nord-camss";

            reg = <0x0 0x09b32000 0x0 0x2000>,
                  <0x0 0x09b38800 0x0 0x2000>,
                  <0x0 0x09b3f000 0x0 0x2000>,
                  <0x0 0x09c31000 0x0 0x2000>,
                  <0x0 0x09c36000 0x0 0x2000>,
                  <0x0 0x09c3b000 0x0 0x2000>,
                  <0x0 0x09c40000 0x0 0x2000>,
                  <0x0 0x09c45000 0x0 0x2000>,
                  <0x0 0x09c4a000 0x0 0x2000>,
                  <0x0 0x09c4f000 0x0 0x2000>,
                  <0x0 0x09c54000 0x0 0x2000>,
                  <0x0 0x09c59000 0x0 0x2000>,
                  <0x0 0x09c5e000 0x0 0x2000>,
                  <0x0 0x09c7b000 0x0 0x2000>,
                  <0x0 0x09c7d000 0x0 0x2000>,
                  <0x0 0x09c7f000 0x0 0x2000>,
                  <0x0 0x09c81000 0x0 0x2000>,
                  <0x0 0x09c83000 0x0 0x2000>,
                  <0x0 0x09b46000 0x0 0x400>,
                  <0x0 0x09b47000 0x0 0x400>,
                  <0x0 0x09b48000 0x0 0x400>,
                  <0x0 0x09ab1000 0x0 0x20000>,
                  <0x0 0x09ad1000 0x0 0x20000>,
                  <0x0 0x09af1000 0x0 0x20000>,
                  <0x0 0x09c31000 0x0 0x5000>,
                  <0x0 0x09c36000 0x0 0x5000>,
                  <0x0 0x09c3b000 0x0 0x5000>,
                  <0x0 0x09c40000 0x0 0x5000>,
                  <0x0 0x09c45000 0x0 0x5000>,
                  <0x0 0x09c4a000 0x0 0x5000>,
                  <0x0 0x09c4f000 0x0 0x5000>,
                  <0x0 0x09c54000 0x0 0x5000>,
                  <0x0 0x09c59000 0x0 0x5000>,
                  <0x0 0x09c5e000 0x0 0x5000>;
            reg-names = "csid0",
                        "csid1",
                        "csid2",
                        "csid_lite0",
                        "csid_lite1",
                        "csid_lite2",
                        "csid_lite3",
                        "csid_lite4",
                        "csid_lite5",
                        "csid_lite6",
                        "csid_lite7",
                        "csid_lite8",
                        "csid_lite9",
                        "csiphy0",
                        "csiphy1",
                        "csiphy2",
                        "csiphy3",
                        "csiphy4",
                        "csitpg0",
                        "csitpg1",
                        "csitpg2",
                        "vfe0",
                        "vfe1",
                        "vfe2",
                        "vfe_lite0",
                        "vfe_lite1",
                        "vfe_lite2",
                        "vfe_lite3",
                        "vfe_lite4",
                        "vfe_lite5",
                        "vfe_lite6",
                        "vfe_lite7",
                        "vfe_lite8",
                        "vfe_lite9";

            clocks = <&camcc CAM_CC_CAMNOC_NRT_AXI_CLK>,
                     <&camcc CAM_CC_CAMNOC_RT_AXI_CLK>,
                     <&camcc CAM_CC_TOP_AHB_CLK>,
                     <&camcc CAM_CC_TOP_FAST_AHB_CLK>,
                     <&camcc CAM_CC_IFE_0_MAIN_CLK>,
                     <&camcc CAM_CC_IFE_1_MAIN_CLK>,
                     <&camcc CAM_CC_IFE_2_MAIN_CLK>,
                     <&camcc CAM_CC_IFE_LITE_CLK>,
                     <&camcc CAM_CC_CSID_CLK>,
                     <&camcc CAM_CC_CSID_CSIPHY_RX_CLK>,
                     <&camcc CAM_CC_CSIPHY0_CLK>,
                     <&camcc CAM_CC_CSI0PHYTIMER_CLK>,
                     <&camcc CAM_CC_CSIPHY1_CLK>,
                     <&camcc CAM_CC_CSI1PHYTIMER_CLK>,
                     <&camcc CAM_CC_CSIPHY2_CLK>,
                     <&camcc CAM_CC_CSI2PHYTIMER_CLK>,
                     <&camcc CAM_CC_CSIPHY3_CLK>,
                     <&camcc CAM_CC_CSI3PHYTIMER_CLK>,
                     <&camcc CAM_CC_CSIPHY4_CLK>,
                     <&camcc CAM_CC_CSI4PHYTIMER_CLK>,
                     <&nwgcc NW_GCC_CAMERA_HF_AXI_CLK>,
                     <&camcc CAM_CC_QDSS_DEBUG_XO_CLK>,
                     <&camcc CAM_CC_IFE_0_MAIN_CLK>,
                     <&camcc CAM_CC_IFE_0_MAIN_FAST_AHB_CLK>,
                     <&camcc CAM_CC_IFE_1_MAIN_CLK>,
                     <&camcc CAM_CC_IFE_1_MAIN_FAST_AHB_CLK>,
                     <&camcc CAM_CC_IFE_2_MAIN_CLK>,
                     <&camcc CAM_CC_IFE_2_MAIN_FAST_AHB_CLK>,
                     <&camcc CAM_CC_IFE_LITE_CLK>,
                     <&camcc CAM_CC_IFE_LITE_AHB_CLK>,
                     <&camcc CAM_CC_IFE_LITE_CPHY_RX_CLK>,
                     <&camcc CAM_CC_IFE_LITE_CSID_CLK>;
            clock-names = "camnoc_nrt_axi",
                          "camnoc_rt_axi",
                          "cpas_ahb",
                          "cpas_fast_ahb",
                          "cpas_vfe0",
                          "cpas_vfe1",
                          "cpas_vfe2",
                          "cpas_vfe_lite",
                          "csid",
                          "csid_csiphy_rx",
                          "csiphy0",
                          "csiphy0_timer",
                          "csiphy1",
                          "csiphy1_timer",
                          "csiphy2",
                          "csiphy2_timer",
                          "csiphy3",
                          "csiphy3_timer",
                          "csiphy4",
                          "csiphy4_timer",
                          "gcc_axi_hf",
                          "qdss_debug_xo",
                          "vfe0",
                          "vfe0_fast_ahb",
                          "vfe1",
                          "vfe1_fast_ahb",
                          "vfe2",
                          "vfe2_fast_ahb",
                          "vfe_lite",
                          "vfe_lite_ahb",
                          "vfe_lite_cphy_rx",
                          "vfe_lite_csid";

            interrupts = <GIC_SPI 509 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 510 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 511 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 637 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 408 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 410 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 412 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 414 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 416 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 418 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 420 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 422 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 424 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 509 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 510 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 511 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 480 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 154 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 445 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 448 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 449 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 601 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 603 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 463 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 638 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 409 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 411 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 413 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 415 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 417 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 419 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 421 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 423 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 827 IRQ_TYPE_EDGE_RISING>;
            interrupt-names = "csid0",
                              "csid1",
                              "csid2",
                              "csid_lite0",
                              "csid_lite1",
                              "csid_lite2",
                              "csid_lite3",
                              "csid_lite4",
                              "csid_lite5",
                              "csid_lite6",
                              "csid_lite7",
                              "csid_lite8",
                              "csid_lite9",
                              "csiphy0",
                              "csiphy1",
                              "csiphy2",
                              "csiphy3",
                              "csiphy4",
                              "csitpg0",
                              "csitpg1",
                              "csitpg2",
                              "vfe0",
                              "vfe1",
                              "vfe2",
                              "vfe_lite0",
                              "vfe_lite1",
                              "vfe_lite2",
                              "vfe_lite3",
                              "vfe_lite4",
                              "vfe_lite5",
                              "vfe_lite6",
                              "vfe_lite7",
                              "vfe_lite8",
                              "vfe_lite9";

            interconnects = <&gem_noc MASTER_APPSS_PROC QCOM_ICC_TAG_ACTIVE_ONLY
                             &config_noc SLAVE_CAMERA_CFG QCOM_ICC_TAG_ACTIVE_ONLY>,
                            <&mmss_noc MASTER_CAMNOC_HF QCOM_ICC_TAG_ALWAYS
                             &mc_virt SLAVE_EBI1 QCOM_ICC_TAG_ALWAYS>;
            interconnect-names = "ahb",
                                 "hf_mnoc";

            iommus = <&apps_smmu 0x1401 0x20>,
                     <&apps_smmu 0x1460 0x00>;

            power-domains = <&camcc CAM_CC_IFE_0_GDSC>,
                            <&camcc CAM_CC_IFE_1_GDSC>,
                            <&camcc CAM_CC_IFE_2_GDSC>,
                            <&camcc CAM_CC_TITAN_TOP_GDSC>;
            power-domain-names = "ife0",
                                 "ife1",
                                 "ife2",
                                 "top";

            vdd-csiphy0-0p8-supply = <&vreg_0p8_supply>;
            vdd-csiphy0-1p2-supply = <&vreg_1p2_supply>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;

                    csiphy_ep0: endpoint {
                        data-lanes = <0 1>;
                        remote-endpoint = <&sensor_ep>;
                    };
                };
            };
        };
    };
